{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: dockerconfigjson
      {{- end }}
      containers:
        - name: events-service
          image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
          imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.eventsService.service.targetPort }}
              protocol: TCP
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_MOVIE_EVENTS
              value: "movie-events"
            - name: KAFKA_TOPIC_USER_EVENTS
              value: "user-events"
            - name: KAFKA_TOPIC_PAYMENT_EVENTS
              value: "payment-events"
          resources:
            limits:
              cpu: {{ .Values.eventsService.resources.limits.cpu }}
              memory: {{ .Values.eventsService.resources.limits.memory }}
            requests:
              cpu: {{ .Values.eventsService.resources.requests.cpu }}
              memory: {{ .Values.eventsService.resources.requests.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: events-service
  ports:
    - port: {{ .Values.eventsService.service.port }}
      targetPort: {{ .Values.eventsService.service.targetPort }}
      protocol: TCP
      name: http
  type: {{ .Values.eventsService.service.type }}
  {{- end }}