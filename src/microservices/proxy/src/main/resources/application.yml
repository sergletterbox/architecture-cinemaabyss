server:
  port: 8000

  servlet:
    context-path: /

spring:
  application:
    name: proxy
  mvc:
    log-request-details: true

logging:
  level:
    com.smarthome.temperatureapi: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Настройки Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method